<html>

<head>
    <title>Online Cyclograph Simulator</title>
    <meta charset="UTF-8">
    <meta name="description" content="Online Cyclograph Simulator">
    <style>
        :root {
            --bg: #f4f4f4;
            --panel: #ffffff;
            --ink: #1d1d1d;
            --muted: #666;
            --border: #d7d7d7;
            --accent: #2c7be5;
            --canvas-bg: #ffffff;
            --control-stroke: #808080;
        }

        body.dark-mode {
            --bg: #0b1020;
            --panel: #141d2b;
            --ink: #edf3ff;
            --muted: #b7c5dd;
            --border: #2b3a4f;
            --accent: #7aa8ff;
            --canvas-bg: #0d1117;
            --control-stroke: #9bb5d9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            transition: background 0.2s ease, color 0.2s ease;
        }

        .panel {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: center;
            padding: 10px 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            margin: 0 auto 12px;
        }

        .control {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
            min-width: 0;
        }

        .control span {
            font-weight: 600;
            white-space: nowrap;
            width: 50px;
        }

        .control.big {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        .control.big span {
            width: 100%;
        }

        .control.checkbox span {
            width: 100%;
        }

        .value {
            width: 56px;
            text-align: right;
            font-size: 11px;
            color: var(--ink);
            font-weight: 700;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 6px;
            height: 26px;
        }

        input[type="range"] {
            width: 110px;
            accent-color: var(--accent);
            margin: 0;
        }

        input[type="number"],
        input[type="text"],
        input[type="select"] {
            width: 80px;
            height: 28px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 6px;
            color: var(--ink);
            background: var(--bg);
        }

        button {
            border: 0;
            background: var(--accent);
            color: white;
            border-radius: 6px;
            padding: 7px 12px;
            font-weight: 600;
            cursor: pointer;
        }

        canvas {
            /* display: block; */
            /* width: min(100%, 1024px); */
        }

        .content {
            display: flex;
            flex-direction: row;
            gap: 12px;
            height: 98vh;
        }

        .sidebar {
            width: 300px;
        }

        .maincontent {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .maincontent .panel {
            width: 100%;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            background: var(--canvas-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: background 0.2s ease;

        }
    </style>
</head>

<body>
    <div class="content">
        <div class="sidebar">


            <div class="panel">
                <label class="control">
                    <span>Left</span>
                    <input id="leftGear" type="range" min="1" max="80" value="43"><input class="value" type="number"
                        min="1" max="80" step="1" value="23" data-slider="leftGear"></label>
                <label class="control">
                    <span>Right</span>
                    <input id="rightGear" type="range" min="1" max="120" value="40"><input class="value" type="number"
                        min="1" max="120" step="1" value="60" data-slider="rightGear"></label>
                <label class="control">
                    <span>Turntable</span>
                    <input id="turntable" type="range" min="1" max="180" value="60"><input class="value" type="number"
                        min="1" max="180" step="1" value="60" data-slider="turntable"></label>

                <label class="control">
                    <span>Anchor</span>
                    <select onchange="(() => {
                        updateParamsFromUI(); 
                    })()" id="anchor">
                        <option>Left</option>
                        <option selected>Right</option>
                    </select></label>

                <label class="control">
                    <span>Left Radius</span>
                    <input id="leftGearRadius" step="0.001" type="range" min="0" max="500" value="100"><input
                        class="value" type="number" min="0" max="500" step="0.1" value="100"
                        data-slider="leftGearRadius"></label>
                <label class="control">
                    <span>Right Radius</span>
                    <input id="rightGearRadius" step="0.001" type="range" min="0" max="500" value="100"><input
                        class="value" type="number" min="0" max="500" step="0.1" value="100"
                        data-slider="rightGearRadius"></label>

                <label class="control checkbox">
                    <span>Reverse Right</span>
                    <input onchange="updateParamsFromUI()" id="reverseRightGear" type="checkbox"></label>
                <label class="control checkbox">
                    <span>Reverse Left</span>
                    <input onchange="updateParamsFromUI()" id="reverseLeftGear" type="checkbox"></label>
                <label class="control checkbox">
                    <span>Reverse Turntable</span>
                    <input onchange="updateParamsFromUI()" id="reverseTurntable" type="checkbox"></label>


                 <label class="control checkbox">
                    <span>Disable Turntable</span>
                    <input onchange="updateParamsFromUI()" id="disableTurntable" type="checkbox"></label>


                <label class="control checkbox">
                    <span>Enable Planetary Gear</span>

                    <input onchange="updateParamsFromUI()" id="planetaryGearEnabled" type="checkbox"></label>

                <label class="control big">

                    <span>Planetary Inner Gear</span>

                    <input id="planetaryInnerGear" type="range" min="1" max="200" step="1" value="120">
                    <input class="value" type="number" min="1" max="200" value="120" data-slider="planetaryInnerGear">
                </label>
                <label class="control big">
                    <span>Planetary Outer Gear</span>
                    <br />
                    <input id="planetaryOuterGear" type="range" min="1" max="200" step="1" value="29">
                    <input class="value" type="number" min="1" max="200" step="1" value="29"
                        data-slider="planetaryOuterGear">
                </label>
            </div>
            <div class="panel">

                    <label class="control">
                    <span>Arm</span>
                    <select onchange="(() => {
                        updateParamsFromUI(); 
                    })()" id="arm">
                        <option selected>Simple</option>
                        <option>Claw</option>
                        <option >SuperClaw</option>
                    </select></label>



                <label class="control">
                    <span>Rod Len</span>
                    <input id="rodLength" type="range" min="-1000" max="1000" value="255"><input class="value"
                        type="number" min="-1000" max="1000" step="1" value="100" data-slider="rodLength"></label>
                <label class="control">
                    <span>Rod X</span>
                    <input id="rodX" type="range" min="0" max="1000" value="500"><input class="value" type="number"
                        min="0" max="1000" step="1" value="500" data-slider="rodX"></label>

                          <label class="control">
                    <span>Rod Angle</span>
                    <input id="rodAngle" type="range" min="-1000" max="1000" value="0" step="0.001"><input class="value" type="number"
                        min="-1000" max="1000" step="0.001" value="0" data-slider="rodAngle"></label>
               
            </div>
            <div class="panel">
                <label class="control">
                    <span>Stroke</span>
                    <input id="strokeSize" type="range" min="0.1" max="10" step="0.1" value="0.5"><input class="value"
                        type="number" min="0.1" max="10" step="0.1" value="1" data-slider="strokeSize"></label>
                <label class="control">
                    <span>Color</span>
                    <input id="strokeColor" type="text" value="black"></label>

                <label style="display:none" class="control">
                    <span>Step</span>
                    <input id="stepSize" type="range" min="0.001" max="0.1" step="0.001" value="0.005"><input
                        class="value" type="number" min="0.001" max="0.1" step="0.001" value="0.005"
                        data-slider="stepSize"></label>
                <label class="control">
                    <span>Speed</span>
                    <input id="speed" type="range" min="1" max="20" step="1" value="1"><input class="value"
                        type="number" min="1" max="20" step="1" value="1" data-slider="speed"></label>

                <label class="control">
                    <span>Controls</span>
                    <input onclick="(() => { 
                        if(!animationHandle) calculatePoint(currentRounds, false, true)
                    })()" type="checkbox" id="drawControls" checked />
                </label>
            </div>
            <div class="panel">
                <button onclick="immediate()">Immediate Result</button>
            </div>
            <div class="panel">
                <button onclick="start()">Start Animation</button>
                <button onclick="stop()">Stop Animation</button>
                <button onclick="reset()">Reset</button>
                <button onclick="restart()">Restart Animation</button>
                <button onclick="last10Percents()">Last 10%</button>
            </div>

            <div class="panel">
                <button id="themeToggle" type="button">Dark mode</button>
                <button onclick="factoryReset()">Factory Reset</button>
            </div>

        </div>

        <div class="maincontent">
            <div id="info-panel" class="panel">
            </div>
            <div style="display: none">
                <div id="mouse-pos"></div>
                <div id="transformed-mouse-pos"></div>
            </div>

            <div class="canvas-container">
                <canvas height="900" width="1000" id="c"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="canvas-pan.js"></script>

</body>

</html>
